[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueferry-immich-photos"
version = "0.2.2"
description = "BlueFerry plugin: recent photos from a self-hosted Immich server"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
# Only blueferry.plugin_api is used from BlueFerry; owner-only files and the
# keyring come from blueferry-plugin-kit. dbus-python, PyGObject and
# libsecret come from the distribution (BlueFerry creates the plugin's venv
# with --system-site-packages).
dependencies = [
  "blueferry-plugin-api @ git+https://github.com/joshii-h/blueferry@plugin-api-v1.2.0#subdirectory=plugin-api",
  "blueferry-plugin-kit @ git+https://github.com/joshii-h/blueferry-plugin-kit@kit-v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "ruff>=0.5,<1"]

[project.urls]
Homepage = "https://github.com/joshii-h/blueferry-plugin-immich"
Source = "https://github.com/joshii-h/blueferry-plugin-immich"

[project.scripts]
blueferry-immich-photos = "blueferry_immich_photos.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blueferry_immich_photos" = ["*.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B904", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["blueferry_immich_photos"]
known-third-party = ["blueferry", "blueferry_plugin_kit"]
